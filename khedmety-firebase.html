<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خدمة مدارس الأحد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#232c46;
    --ink-soft:#68709a;
    --bg:#f6f0e2;
    --panel:#fffefb;
    --panel-line:#e9dfc4;
    --navy:#22357a;
    --navy-deep:#0f1c45;
    --navy-bright:#2f4aa8;
    --gold:#e0a83e;
    --gold-deep:#a8721a;
    --gold-light:#f6d98a;
    --leaf:#3f9169;
    --coral:#d8604a;
    --radius-tile: 22px;
    --radius-card: 16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(900px 420px at 50% -120px, #fff6de99, transparent),
      var(--bg);
    color:var(--ink);
    font-family:'Cairo',sans-serif;
    min-height:100vh;
    direction:rtl;
  }
  #root{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:28px;}

  /* ---- Top bar ---- */
  .topbar{
    background:linear-gradient(135deg,var(--navy-deep),var(--navy) 65%,var(--navy-bright));
    border-bottom:3px solid var(--gold);
    padding:14px 16px;
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:20;
    box-shadow:0 6px 18px rgba(15,28,69,.28);
  }
  .brand{display:flex;flex-direction:column;align-items:center;line-height:1;}
  .brand-logo-img{width:36px;height:36px;border-radius:50%;object-fit:cover;margin-bottom:4px;border:2px solid var(--gold-light);box-shadow:0 2px 8px rgba(0,0,0,.35);}
  .brand .headline{font-family:'Cairo',sans-serif;font-weight:800;font-size:15px;color:#fff;letter-spacing:.2px;text-shadow:0 1px 2px rgba(0,0,0,.25);}
  .brand .sub{font-size:10px;color:var(--gold-light);margin-top:2px;letter-spacing:.4px;}
  .icon-btn{
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:19px;color:var(--gold-light);
    width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .icon-btn:active{background:rgba(255,255,255,.2);}

  .menu-panel{
    position:absolute;top:64px;left:12px;background:var(--panel);border:1px solid var(--panel-line);
    border-top:3px solid var(--gold);
    border-radius:14px;box-shadow:0 14px 34px rgba(15,28,69,.28);overflow:hidden;z-index:30;min-width:190px;
  }
  .menu-panel button{
    display:block;width:100%;text-align:right;padding:13px 16px;background:none;border:none;
    font-family:'Cairo';font-size:14.5px;color:var(--ink);cursor:pointer;border-bottom:1px solid #f0ece0;
  }
  .menu-panel button:last-child{border-bottom:none;}
  .menu-panel button:active{background:#f4efe4;}

  .class-pill{
    margin:12px 16px 0;background:linear-gradient(135deg,var(--panel),#fff9ec);border:1px solid var(--gold-light);border-radius:12px;
    padding:8px 12px;font-size:13px;color:var(--ink-soft);display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 3px 10px rgba(224,168,62,.14);
  }
  .class-pill select{font-family:'Cairo';font-size:13px;border:1px solid var(--panel-line);border-radius:8px;padding:5px 8px;background:#fff;color:var(--ink);}

  /* ---- content ---- */
  .content{padding:18px 16px 40px;}
  .screen-title{font-size:19px;font-weight:800;color:var(--navy-deep);margin:2px 0 16px;display:flex;align-items:center;gap:8px;position:relative;padding-bottom:12px;}
  .screen-title::after{content:'';position:absolute;bottom:0;right:0;width:52px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold-light));}
  .screen-title .fa{font-size:17px;color:var(--gold-deep);}

  /* Home grid */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px;}
  .tile{
    background:linear-gradient(160deg,var(--panel),#fffaf0);border:1px solid var(--panel-line);border-radius:var(--radius-tile);
    padding:18px 10px 14px;text-align:center;cursor:pointer;position:relative;
    transition:transform .12s ease, box-shadow .12s ease;
    box-shadow:0 4px 14px rgba(15,28,69,.07);
  }
  .tile:active{transform:scale(.96);box-shadow:0 2px 6px rgba(15,28,69,.1);}
  .tile .badge{
    position:absolute;top:10px;left:10px;background:linear-gradient(135deg,#e8806a,var(--coral));color:#fff;font-size:11px;
    min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:700;
    box-shadow:0 2px 6px rgba(216,96,74,.5);
  }
  .tile .ico{
    width:58px;height:58px;border-radius:18px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;
    box-shadow:0 6px 14px -4px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .tile .lbl{font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.35;}
  .t-navy .ico{background:linear-gradient(150deg,var(--navy-bright),var(--navy-deep));}
  .t-gold .ico{background:linear-gradient(150deg,var(--gold-light),var(--gold-deep));}
  .t-leaf .ico{background:linear-gradient(150deg,#79c79c,var(--leaf));}
  .t-coral .ico{background:linear-gradient(150deg,#ea9483,var(--coral));}

  /* Cards / lists */
  .card{background:linear-gradient(160deg,var(--panel),#fffdf7);border:1px solid var(--panel-line);border-radius:var(--radius-card);padding:14px 15px;margin-bottom:12px;box-shadow:0 3px 10px rgba(15,28,69,.05);}
  .card .row1{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .card .name{font-weight:800;font-size:15px;color:var(--navy-deep);}
  .card .meta{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .chip{display:inline-block;font-size:11px;background:linear-gradient(135deg,#eef1fb,#e2e7fa);color:var(--navy);padding:3px 9px;border-radius:20px;margin-inline-start:6px;font-weight:700;}
  .empty{text-align:center;color:var(--ink-soft);padding:38px 10px;font-size:14px;line-height:1.8;}
  .empty .fa{font-size:30px;color:var(--gold-light);display:block;margin-bottom:10px;}

  /* Buttons */
  .btn{
    font-family:'Cairo';font-weight:700;font-size:14px;border:none;border-radius:13px;padding:12px 16px;cursor:pointer;
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:linear-gradient(135deg,var(--navy-bright),var(--navy-deep));color:#fff;width:100%;box-shadow:0 8px 18px -6px rgba(15,28,69,.55);}
  .btn-primary:active{box-shadow:0 4px 10px -4px rgba(15,28,69,.5);}
  .btn-gold{background:linear-gradient(135deg,var(--gold-light),var(--gold-deep));color:#3a2600;box-shadow:0 8px 18px -6px rgba(168,114,26,.55);}
  .btn-ghost{background:#fff;color:var(--navy-deep);border:1px solid var(--panel-line);}
  .btn-danger{background:#fff;color:var(--coral);border:1px solid #f0c7bd;}
  .btn-sm{padding:8px 12px;font-size:12.5px;border-radius:10px;}
  .btn-row{display:flex;gap:8px;margin-top:10px;}
  .full{width:100%;}

  /* Forms */
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;font-weight:700;}
  .field input,.field select,.field textarea{
    width:100%;font-family:'Cairo';font-size:14.5px;padding:11px 12px;border-radius:11px;
    border:1px solid var(--panel-line);background:#fff;color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:70px;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(224,168,62,.22);}
  .note{background:linear-gradient(135deg,#eef1fb,#e6ecfb);border-radius:11px;padding:10px 12px;font-size:12.5px;color:var(--navy-deep);margin-bottom:14px;line-height:1.7;border-right:3px solid var(--navy-bright);}
  .error-box{background:#fdeceb;color:#a3392a;border:1px solid #f2c3bb;border-radius:11px;padding:10px 12px;font-size:13px;margin-bottom:12px;}
  .ok-box{background:#eaf5ee;color:#2b6b46;border:1px solid #c4e3d0;border-radius:11px;padding:10px 12px;font-size:13px;margin-bottom:12px;}

  /* Login */
  .login-wrap{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 22px;
    background:
      radial-gradient(600px 320px at 50% -40px, rgba(224,168,62,.18), transparent),
      radial-gradient(500px 500px at 100% 100%, rgba(47,74,168,.12), transparent),
      var(--bg);
  }
  .login-logo-img{width:100px;height:100px;border-radius:50%;object-fit:cover;box-shadow:0 10px 26px rgba(15,28,69,.3);margin-bottom:16px;border:3px solid var(--gold);}
  .login-logo{font-family:'Cairo',sans-serif;font-weight:800;font-size:23px;color:var(--navy-deep);margin-bottom:2px;text-align:center;line-height:1.4;}
  .login-sub{color:var(--gold-deep);font-size:13.5px;margin-bottom:30px;font-weight:700;letter-spacing:.3px;}
  .role-card{
    width:100%;max-width:340px;background:linear-gradient(165deg,var(--panel),#fffaf0);border:1px solid var(--gold-light);border-radius:22px;
    padding:24px 20px;margin-bottom:14px;box-shadow:0 16px 36px -12px rgba(15,28,69,.25);
  }
  .role-toggle{display:flex;gap:8px;margin-bottom:20px;}
  .role-toggle button{
    flex:1;padding:12px 6px;border-radius:13px;border:1px solid var(--panel-line);background:#fff;
    font-family:'Cairo';font-weight:700;font-size:13.5px;color:var(--ink-soft);cursor:pointer;
  }
  .role-toggle button.active{background:linear-gradient(135deg,var(--navy-bright),var(--navy-deep));color:#fff;border-color:var(--navy-deep);box-shadow:0 6px 14px -4px rgba(15,28,69,.5);}

  .points-row{display:flex;align-items:center;gap:10px;}
  .points-val{min-width:34px;text-align:center;font-weight:800;color:var(--gold-deep);font-size:16px;}
  .round-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--panel-line);background:#fff;font-size:16px;font-weight:800;color:var(--navy-deep);cursor:pointer;}
  .round-btn:active{background:#f0ece0;}

  table.db{width:100%;border-collapse:collapse;font-size:12.8px;}
  table.db th,table.db td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--panel-line);}
  table.db th{color:#fff;font-weight:700;background:linear-gradient(135deg,var(--navy-bright),var(--navy-deep));}
  table.db tr:first-child th:first-child{border-top-right-radius:8px;}
  table.db tr:first-child th:last-child{border-top-left-radius:8px;}
  .scrollx{overflow-x:auto;}

  .footer-note{text-align:center;color:var(--ink-soft);font-size:11.5px;margin-top:26px;line-height:1.8;}
  a.link-btn{color:var(--navy-deep);text-decoration:underline;font-size:13px;cursor:pointer;}

  /* Students overview (fresh, non-traditional landing) */
  .overview-hero{text-align:center;padding:26px 10px 22px;background:radial-gradient(420px 200px at 50% 0%, rgba(224,168,62,.16), transparent);border-radius:24px;}
  .overview-hero img{width:88px;height:88px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);box-shadow:0 8px 20px rgba(15,28,69,.22);margin-bottom:10px;}
  .overview-hero .oh-title{font-weight:800;font-size:19px;color:var(--navy-deep);}
  .overview-hero .oh-sub{font-size:12.5px;color:var(--gold-deep);font-weight:700;margin-top:2px;}
  .overview-hero .oh-divider{color:var(--gold);font-size:14px;margin:14px 0;opacity:.7;}
  .overview-hero .oh-caption{font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;}
  .btn-excel{
    font-family:'Cairo';font-weight:800;font-size:14px;border:none;border-radius:14px;padding:13px 22px;cursor:pointer;color:#fff;
    background:linear-gradient(135deg,#3fae6e,#1f7d47);box-shadow:0 10px 22px -8px rgba(31,125,71,.6);
    position:relative;overflow:hidden;transition:transform .12s ease;
  }
  .btn-excel:active{transform:scale(.97);}
  .class-overview-card{
    background:linear-gradient(160deg,var(--panel),#fffaf0);border:1px solid var(--panel-line);border-radius:20px;
    padding:18px 14px;text-align:right;cursor:pointer;box-shadow:0 4px 14px rgba(15,28,69,.07);
    transition:transform .12s ease;
  }
  .class-overview-card:active{transform:scale(.96);}
  .class-overview-card .stage-tag{display:inline-block;font-size:11px;font-weight:800;color:var(--gold-deep);background:#fbeecb;padding:3px 10px;border-radius:20px;margin-bottom:8px;}
  .class-overview-card .coc-name{font-weight:800;font-size:15px;color:var(--navy-deep);line-height:1.4;margin-bottom:10px;}
  .class-overview-card .coc-count{font-size:30px;font-weight:800;color:var(--navy-bright);line-height:1;}
  .class-overview-card .coc-caption{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}

  /* ================= Motion / light animations ================= */
  @keyframes fadeInUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  @keyframes scaleIn{ from{opacity:0; transform:scale(.9);} to{opacity:1; transform:scale(1);} }
  @keyframes floatY{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
  @keyframes shimmer{ 0%{background-position:-160% 0;} 100%{background-position:160% 0;} }
  @keyframes bgShift{ 0%,100%{background-position:0% 0%;} 50%{background-position:100% 100%;} }
  @keyframes slideDown{ from{opacity:0; transform:translateY(-10px);} to{opacity:1; transform:translateY(0);} }
  @keyframes growBar{ from{width:0;} to{width:52px;} }

  .content{animation:fadeInUp .38s cubic-bezier(.22,.8,.32,1) both;}
  .topbar{animation:slideDown .35s ease both;}
  .menu-panel{animation:fadeInUp .18s ease both;}
  .card{animation:fadeInUp .35s cubic-bezier(.22,.8,.32,1) both;}

  .grid .tile{animation:fadeInUp .4s cubic-bezier(.22,.8,.32,1) both;}
  .grid .tile:nth-child(1){animation-delay:.02s;} .grid .tile:nth-child(2){animation-delay:.06s;}
  .grid .tile:nth-child(3){animation-delay:.10s;} .grid .tile:nth-child(4){animation-delay:.14s;}
  .grid .tile:nth-child(5){animation-delay:.18s;} .grid .tile:nth-child(6){animation-delay:.22s;}
  .grid .tile:nth-child(7){animation-delay:.26s;} .grid .tile:nth-child(8){animation-delay:.30s;}
  .grid .tile:nth-child(9){animation-delay:.34s;} .grid .tile:nth-child(10){animation-delay:.38s;}
  .grid .tile:nth-child(11){animation-delay:.42s;} .grid .tile:nth-child(12){animation-delay:.46s;}
  .grid .tile:nth-child(13){animation-delay:.50s;}

  .tile{transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease;}
  .tile:active{transform:scale(.94) translateY(1px);}
  .tile .ico{transition:transform .25s cubic-bezier(.34,1.56,.64,1);}
  .tile:active .ico{transform:scale(.9) rotate(-4deg);}

  .btn{position:relative;overflow:hidden;transition:transform .12s ease, box-shadow .12s ease;}
  .btn-primary::after, .btn-excel::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(120deg, transparent 35%, rgba(255,255,255,.32) 50%, transparent 65%);
    background-size:220% 100%;
    animation:shimmer 3.2s ease-in-out infinite;
  }
  .round-btn{transition:transform .15s cubic-bezier(.34,1.56,.64,1);}
  .round-btn:active{transform:scale(.85);}

  .login-wrap{background-size:200% 200%;animation:bgShift 16s ease-in-out infinite;}
  .login-logo-img{animation:scaleIn .5s cubic-bezier(.22,.8,.32,1) both, floatY 4.5s ease-in-out 1s infinite;}
  .login-logo{animation:fadeInUp .5s ease .1s both;}
  .login-sub{animation:fadeInUp .5s ease .18s both;}
  .role-card{animation:fadeInUp .5s cubic-bezier(.22,.8,.32,1) .22s both;}

  .class-overview-card{animation:fadeInUp .4s cubic-bezier(.22,.8,.32,1) both;transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease;}
  .class-overview-card:active{transform:scale(.95);}
  .overview-hero img{animation:scaleIn .5s cubic-bezier(.22,.8,.32,1) both, floatY 4.5s ease-in-out 1s infinite;}
  .screen-title::after{animation:growBar .5s cubic-bezier(.22,.8,.32,1) .08s both;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
  }

  /* Offline/online status banner */
  .net-banner{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    max-width:88%;z-index:999;padding:10px 18px;border-radius:30px;
    font-family:'Cairo';font-weight:700;font-size:12.5px;text-align:center;
    box-shadow:0 10px 24px rgba(0,0,0,.22);animation:fadeInUp .3s ease both;
  }
  .net-offline{background:linear-gradient(135deg,#e0a83e,#b8721a);color:#fff;}
  .net-online{background:linear-gradient(135deg,#3fae6e,#1f7d47);color:#fff;}
</style>
</head>

<script>

    p.catch(e=>console.error('sset (will retry when online):', key, e));
    return Promise.resolve(true);
  }catch(e){ console.error('sset', key, e); return Promise.resolve(false); }
}

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function fileToCompressedDataURL(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w=img.width, h=img.height;
        if(w>h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } }
        else { if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

async function renderBirthdays(){
  const cid = currentClassId();
  const students = await sget('students:'+cid) || [];
  const withB = students.filter(s=>s.birthday);
  const today = new Date();
  const md = d => { const dt=new Date(d); return (dt.getMonth()+1)*100+dt.getDate(); };
  const todayMd = (today.getMonth()+1)*100+today.getDate();
  withB.sort((a,b)=>{
    let da = md(a.birthday)-todayMd; if(da<0) da+=1300;
    let db = md(b.birthday)-todayMd; if(db<0) db+=1300;
    return da-db;
  });
  root().innerHTML = topbar() + `
  <div class="content">
    <div class="screen-title"><i class="fa fa-cake-candles"></i> أعياد الميلاد — ${esc(className(cid))}</div>

      withB.map(s=>{
        const dt=new Date(s.birthday);
        const isToday = (dt.getMonth()+1)===today.getMonth()+1 && dt.getDate()===today.getDate();
        return `<div class="card">
          <div class="row1"><div class="name">${esc(s.name)} ${isToday?'🎉':''}</div><span class="chip">${dt.getDate()}/${dt.getMonth()+1}</span></div>
          ${isToday?`<div class="meta" style="color:var(--coral);font-weight:700">النهاردة عيد ميلاده!</div>`:''}
        </div>`;
      }).join('')}
  </div>`;
}

/* ================= ATTENDANCE ================= */
async function computeAttendanceAlerts(cid){
  const students = await sget('students:'+cid) || [];
  const attMap = (await sget('attendance:'+cid)) || {};
  const dates = Object.keys(attMap).sort().reverse();
  const lastTwo = dates.slice(0,2);
  if(lastTwo.length<2) return 0;
  let count=0;
  students.forEach(s=>{
    const missedBoth = lastTwo.every(d=>{
      const r = attMap[d][s.id];
      return !r || (!r.sunday && !r.mass);
    });
    if(missedBoth) count++;
  });
  return count;
}
async function renderAttendance(dateStr){
  dateStr = dateStr || todayStr();
  const cid = currentClassId();
  const students = await sget('students:'+cid) || [];
  const attMap = (await sget('attendance:'+cid)) || {};
  const dayRec = attMap[dateStr] || {};
  const editable = canEdit();
  const dates = Object.keys(attMap).sort().reverse();
  const lastTwo = dates.slice(0,2);
  let alerts = [];
  if(lastTwo.length===2){
    students.forEach(s=>{
      const missedBoth = lastTwo.every(d=>{
        const r = attMap[d][s.id];
        return !r || (!r.sunday && !r.mass);
      });
      if(missedBoth) alerts.push(s.name);
    });
  }
  root().innerHTML = topbar() + `
  <div class="content">
    <div class="screen-title"><i class="fa fa-clipboard-check"></i> الحضور — ${esc(className(cid))}</div>
    ${alerts.length? `<div class="error-box">⚠️ غياب متكرر آخر مرتين: ${alerts.map(esc).join('، ')}</div>` : ''}
    ${state.flash?`<div class="ok-box">${esc(state.flash)}</div>`:''}
    <div class="field"><label>التاريخ</label><input type="date" value="${dateStr}" onchange="renderAttendance(this.value)"></div>
    ${students.length===0? `<div class="empty"><i class="fa-solid fa-user-group fa"></i>مفيش أطفال مسجّلين في الفصل لسه.</div>` :
      students.map(s=>{
        const r = dayRec[s.id] || {sunday:false, mass:false};
        return `
        <div class="card">
          <div class="row1"><div class="name">${esc(s.name)}</div></div>
          <div class="btn-row" style="margin-top:8px;flex-wrap:wrap">
            <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft)">
              <input type="checkbox" id="att_${s.id}_sun" ${r.sunday?'checked':''} ${editable?'':'disabled'}> مدارس الأحد
            </label>
            <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft)">
              <input type="checkbox" id="att_${s.id}_mass" ${r.mass?'checked':''} ${editable?'':'disabled'}> القداس
            </label>
          </div>
        </div>`;
      }).join('')
    }
    ${editable && students.length>0 ? `<button class="btn btn-primary full" onclick="saveAttendance('${dateStr}')">حفظ الحضور</button>` : ''}
  </div>`;
}
async function saveAttendance(dateStr){
  const cid = currentClassId();
  const students = await sget('students:'+cid) || [];
  const attMap = (await sget('attendance:'+cid)) || {};
  const dayRec = {};
  students.forEach(s=>{
    const sun = document.getElementById('att_'+s.id+'_sun').checked;
    const mass = document.getElementById('att_'+s.id+'_mass').checked;
    dayRec[s.id] = {sunday:sun, mass:mass};
  });
  attMap[dateStr] = dayRec;
  await sset('attendance:'+cid, attMap);
  state.flash='تم حفظ الحضور بنجاح.';
  renderAttendance(dateStr);
}

/* ================= OFFLINE STATUS BANNER ================= */
function updateNetBanner(){
  let el = document.getElementById('netBanner');
  if(!el){
    el = document.createElement('div');
    el.id = 'netBanner';
    document.body.appendChild(el);
  }
  if(!navigator.onLine){
    el.className = 'net-banner net-offline';
    el.textContent = '📴 مفيش إنترنت دلوقتي — أي حاجة تضيفها هتتحفظ وتتزامن لوحدها أول ما النت يرجع.';
    el.style.display = 'block';
    el.dataset.wasOffline = '1';
  } else if(el.dataset.wasOffline === '1'){
    el.className = 'net-banner net-online';
    el.textContent = '✅ النت رجع — البيانات بتتزامن دلوقتي.';
    el.style.display = 'block';
    el.dataset.wasOffline = '0';
    setTimeout(()=>{ el.style.display = 'none'; }, 3000);
  } else {
    el.style.display = 'none';
  }
}
window.addEventListener('online', updateNetBanner);
window.addEventListener('offline', updateNetBanner);

/* ================= ADD TO HOME SCREEN (PWA manifest) ================= */
function setupHomeScreenSupport(){
  try{
    const manifest = {
      name: CHURCH_NAME,
      short_name: CHURCH_NAME,
      start_url: location.href.split('#')[0],
      display: 'standalone',
      background_color: '#f6f0e2',
      theme_color: '#0f1c45',
      icons: [
        {src: CHURCH_LOGO, sizes: '240x240', type: 'image/jpeg'}
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = url;
    document.head.appendChild(link);

    const appleIcon = document.createElement('link');
    appleIcon.rel = 'apple-touch-icon';
    appleIcon.href = CHURCH_LOGO;
    document.head.appendChild(appleIcon);

    const meta1 = document.createElement('meta');
    meta1.name = 'apple-mobile-web-app-capable'; meta1.content = 'yes';
    document.head.appendChild(meta1);
    const meta2 = document.createElement('meta');
    meta2.name = 'apple-mobile-web-app-title'; meta2.content = CHURCH_NAME;
    document.head.appendChild(meta2);
    const meta3 = document.createElement('meta');
    meta3.name = 'theme-color'; meta3.content = '#0f1c45';
    document.head.appendChild(meta3);
  }catch(e){ console.warn('home screen setup failed', e); }
}
